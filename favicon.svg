  <ellipse cx="256" cy="256" rx="60" ry="160" fill="none" stroke="#223454" stroke-width="6" opacity="0.8" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#223454" stroke-width="6" opacity="0.8" />
