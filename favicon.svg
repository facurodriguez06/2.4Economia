<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09121C" />
      <stop offset="100%" stop-color="#152238" />
    </linearGradient>
  </defs>
  <!-- Background circle with border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#FF9100" stroke-width="8" />
  
  <!-- Globe Grid Lines (Naval Blue) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#223454" stroke-width="6" opacity="0.8" />
